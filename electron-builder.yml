appId: com.alivo.os
productName: ALIVO OS
copyright: Copyright © 2026 ALIVO

directories:
  output: release

files:
  - electron/**/*
  - ui/**/*
  - build/runtime/**/*
  - package.json

asar: true

win:
  executableName: ALIVO OS
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  include: installer/windows-installer.nsh
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  menuCategory: false
  shortcutName: ALIVO OS
  uninstallDisplayName: ALIVO OS
  runAfterFinish: false
  deleteAppDataOnUninstall: false

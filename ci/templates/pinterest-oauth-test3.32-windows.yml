name: Pinterest OAuth test.3.32 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.32

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.32'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.32
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.32-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.32-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.32-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.32-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.32-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.32") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Complete source checkpoint: d0deb934c2337195d810212e1d942bbd09b7c78a. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev: 0 vulnerabilities; authenticated read-only Pinterest connection; Windows DPAPI encrypted local vault; unsigned Windows x64 test build. Adds explicit, deterministic, session-local Top Pins manual review selection. Selection is always initiated by the CEO; no Pin is selected automatically. Every safe snapshot-matched Top Pin has a native Select for review / Remove from review toggle. Toggle state uses aria-pressed and supports mouse, Enter, and Space. Adds a compact Selected for review marker. Adds Selected for review (N) as the fifth existing-pipeline local filter. Adds the deterministic manual-selection summary, specific empty state, and conditional Clear review selection button. Selection is bounded to the existing maximum 25 Top Pins. State uses only a non-rendered UI-local source-order identity. Raw Pin IDs, titles, boards, URLs, and provider fields are not used as selection keys. Selection is session-local and non-persistent. Selection survives sorting, filtering, chart selectors, readiness-detail interaction, Performance navigation, duplicate observations, repeated rendering, and retained stale results. Selection resets for a newly accepted Top Pins result, changed Pin snapshot, authentication clearing, reauthorization clearing, or loss of the retained Top Pins result. Deselecting a row within the Selected filter removes it immediately. Clearing all selections leaves the selected filter active and renders its bounded empty state. Switching back to All restores every safe row. Existing readiness badge filters and readiness-detail expansion remain unchanged. Existing stable sorting and filtering preserve one another. Charts, contribution calculations, account context, readiness summaries, rankings, and DTOs remain based on the complete retained result, not the selected subset. No input DTO, snapshot, source array, chart input, or audit object is mutated. Selection, deselection, clearing, filtering, sorting, rendering, navigation, selectors, and stale rendering issue zero additional Pinterest requests. Explicit Read observation, Read account performance, Read Top Pins, and Read Pin performance actions remain the only request sources. No startup, background, retry, pagination, fallback, Pinterest write, save, update, or delete request is introduced. No persistence, clipboard, filesystem write, renderer network transport, raw Pin ID, provider payload, audit code, OAuth material, credential, URL, or private data is introduced. No unsafe HTML/SVG, inline event handler, score, recommendation, prediction, automatic priority, or causal claim is introduced. No API, DTO, OAuth, Electron, IPC, lifecycle, authentication, dependency, or package contract changes are made. Visible disclosure states: `Manual local selection only. Pins are not scored, recommended, edited, or saved.` Native Windows Electron test: 1/1 passed. Packaged-app visual and functional verification: passed. Local validation archive: ALIVO-OS-Pinterest-OAuth-test.3.32-local-win-x64.zip. Bytes: 140556240. SHA-256: cb18a21a5101302cc76aca62230bb78e9488eb35b3b8eb0dfdafdcbb079e3be3. Checksum match: true. This is local validation evidence; the automatic workflow independently creates and audits the official archive."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

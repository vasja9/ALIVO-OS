name: Pinterest OAuth test.3.31 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.31

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.31'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.31
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.31-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.31-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.31-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.31-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.31-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.31") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Complete source checkpoint: 144c8c47588b238cd7befb183ee7e198666dbd0e. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev: 0 vulnerabilities; authenticated read-only Pinterest connection; Windows DPAPI encrypted local vault; unsigned Windows x64 test build. Adds safe deterministic Content readiness details to snapshot-matched Top Pins. Existing contentReadiness summary remains unchanged. Adds only the bounded sibling renderer field: contentReadinessDetails: null | { readonly required: readonly string[]; readonly review: readonly string[]; }. Details are derived only from the authoritative 12 fixed local audit rules. Trusted composition joins by internal Pin ID and removes the ID before renderer DTO construction. Audit codes are never exposed to the renderer. Exact code, level, and fixed-message validation is required. Arbitrary, unknown, duplicate, mismatched, malformed, excessive, or count-inconsistent details fail closed to null for that row only. Valid rank, metrics, title, board, and readiness summary remain available if details fail. Details are copied, bounded, immutable, and ordered with Required before Review. Ready rows produce valid empty Required and Review arrays. Renderer state independently validates the exact safe shape and discards unknown properties. Valid NeedsAttention rows provide a separate native View readiness details button. Existing Content needs attention badge filtering remains unchanged. Mouse, Enter, and Space activation are supported. The inline region uses aria-expanded and aria-controls. At most one Top Pins row is expanded. Ready, unavailable, and invalid-detail rows are not expandable. Expansion state is session-local and non-persistent. Valid expansion survives sorting, filtering, navigation, duplicate observations, and retained stale results. It resets for a new Top Pins result, changed snapshot, authentication clearing, or loss of the retained result. Rendering, expansion, collapse, filtering, sorting, selectors, navigation, duplicate observations, and stale rendering issue zero additional Pinterest requests. Explicit read actions remain the only request sources. Maximum bounds remain 25 Top Pins and 12 readiness details. No source DTO or retained snapshot is mutated. No raw Pin IDs, board IDs, provider payloads, arbitrary messages, audit codes, URLs, OAuth material, tokens, credentials, headers, cookies, or callback data are rendered. No unsafe HTML/SVG, inline event attribute, renderer network transport, persistence, score, prediction, recommendation, or causal claim is introduced. No Pinterest API, parser, OAuth, Electron IPC, lifecycle, authentication, dependency, or package contract changes are made. Native Windows Electron test: 1/1 passed. Visual packaged-app verification: passed. Local validation archive: ALIVO-OS-Pinterest-OAuth-test.3.31-local-win-x64.zip. Bytes: 140555454. SHA-256: 0b058108da42f3d4a147815c3dbadef4344c06a32589a0d656525e462e9314b5. Checksum match: true. The local checksum is evidence only; the workflow independently creates and audits the official archive."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

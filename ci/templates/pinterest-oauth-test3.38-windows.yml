name: Pinterest OAuth test.3.38 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.38

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.38'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.38
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.38-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-pin-family-memory.cjs
          node --check electron/pinterest-lifecycle-evidence-memory.cjs
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.38-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.38-win-x64.zip.sha256"
          $records = @(Get-Content -LiteralPath $sidecar.FullName | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($records.Count -ne 1) { throw "Portable sidecar must contain exactly one SHA-256 record" }
          $record = [regex]::Match($records[0], '^([0-9a-fA-F]{64}) {2}' + [regex]::Escape($zip.Name) + '$')
          if (-not $record.Success) { throw "Portable sidecar has an invalid hash or ZIP filename" }
          $expected = $record.Groups[1].Value.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -cne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.38-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-(?:local-config|lifecycle-evidence|pin-families|sessions)\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          $packageRoot = Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.38-win-x64"
          foreach ($requiredPath in @("ALIVO OS.exe", "README-FIRST.txt", "resources/app.asar")) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $requiredPath))) {
              throw "Portable ZIP is missing required path: $requiredPath"
            }
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.38") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Complete source checkpoint: 34412d93b23e84a4a0b601c369ae4932779f762e. Foundation: Electron 43.4.1; authenticated read-only Pinterest connection; Windows DPAPI encrypted local vault; bounded lifecycle evidence memory; immutable lifecycle variant brief; deterministic unsigned Windows x64 test build. Adds bounded encrypted cross-session Pinterest Pin family lineage memory behind the Electron main-process boundary. It records one original Pin and at most three actually published variants for cohorts Days60To90, Days91To180, and Days181To600. Families are capped at 1,000 and four members. Exact idempotent replays are safe; conflicting originals or variants, duplicate provider Pin assignments, invalid references or UTC instants, unrelated deterministic brief references, missing originals, backward cohort history, and capacity overflow fail closed. Stored Pin and brief references remain only in the safeStorage-encrypted document; renderer-safe summaries expose family reference, member count, and used cohorts only. Writes are serialized, atomic, and permission-restricted. The original Pin is never edited or deleted. No creative is generated, no review engine is duplicated, no UI or scheduler is added, and no Pinterest request, pins:write scope, publish, edit, delete, rerun, or automatic recommendation is introduced. Application behavior remains unchanged until an approved coordinator records actual published variants. Native Windows validation: PASS, run 33261664423, attempt 1. Node: 22.23.2. Unit tests: 924/924. Pinterest DOM: 35/35. Windows integration: 1/1. Local configuration: 11/11. Package verification: PASS. GitHub failure annotations: 0. Active @v4 references: 0. Node 20 warnings: 0. Verified validation archive: ALIVO-OS-Pinterest-OAuth-test.3.38-validation-win-x64.zip. Validation archive bytes: 140566152. Validation sidecar bytes: 124. Validation archive SHA-256: 0ff0393fec95153995c139d7077be33cad38283d61b0daf242889a8202c71663. Sidecar checksum: exact match. This checksum is validation evidence; the tagged workflow independently creates and audits the official archive."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

name: Pinterest OAuth test.3.33 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.33

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.33'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.33
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.32-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.33-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.33-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.33-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.33-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.33") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Complete source checkpoint: 910640d22baa0d18bc4e6904d3d6dfe1b3c174e5. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev: 0 vulnerabilities; authenticated read-only Pinterest connection; Windows DPAPI encrypted local vault; unsigned Windows x64 test build. Adds a deterministic session-local Manual Top Pins review workspace to the existing Attention tab. Existing Attention content and existing Attention counts remain unchanged. Only explicitly selected snapshot-matched Top Pins enter the workspace. The workspace displays selected, pending, and reviewed counts with selected = pending + reviewed. Adds All selected, Pending review, and Reviewed local filters. Selected cards remain in retained endpoint source order. Cards display only copied safe title, board, rank, metrics, outbound context, readiness status, and fixed readiness details. Counts preserve exact safe integers and zero. Rates display two decimals, unavailable values display an em dash, and outbound context uses signed percentage points. Required readiness details appear before Review details. Maximums remain 25 selected cards and 12 fixed readiness messages per card. Every newly selected Pin begins Pending. No Pin is marked Reviewed automatically. Native Mark reviewed / Mark pending buttons use aria-pressed and support mouse, Enter, and Space. Reviewed means only that the CEO completed the local review step. Reviewed does not mean that Pin content was corrected, saved, published, or updated. Native Remove from review selection and Clear review selection controls synchronize Attention and Performance. Removing and later reselecting a row returns it to Pending. Review state is always a bounded subset of the current manual selection. Review state survives navigation, filters, sorting, selectors, readiness-detail interaction, repeated rendering, duplicate observations, and retained stale results. It resets for removal, clearing, a new accepted Top Pins result, changed snapshot, authentication clearing, reauthorization clearing, or loss of retained Top Pins. Existing Performance filters, charts, sorting, account summaries, contribution calculations, readiness summaries, rankings, and DTOs remain unchanged. Rendering, marking, filtering, removal, clearing, navigation, sorting, selectors, duplicate observations, and stale rendering issue zero additional Pinterest requests. Explicit Read observation, Read account performance, Read Top Pins, and Read Pin performance actions remain the only request sources. No startup, background, pagination, retry, fallback, Pinterest write, save, update, or delete request is introduced. No source DTO, retained snapshot, source array, chart input, account result, Top Pins result, or audit object is mutated. No persistence, clipboard, download, filesystem, renderer transport, raw Pin ID, board ID, provider payload, arbitrary audit message, audit code, URL, OAuth material, credential, or private field is introduced. No unsafe HTML/SVG, inline event attribute, score, recommendation, automatic priority, prediction, best/worst label, performance judgment, or causal claim is introduced. No API, DTO, OAuth, Electron, IPC, lifecycle, authentication, dependency, or package contract change is made. Disclosure: `Local review status only. No Pin content or Pinterest state is changed.` Native Windows Electron test: 1/1 passed. Packaged-app functional verification: passed. Performance/Attention synchronization: visually verified. Local validation archive: ALIVO-OS-Pinterest-OAuth-test.3.33-local-win-x64.zip. Bytes: 140558499. SHA-256: 4d74ffedb1005111dfa07f41c1744bfaa1c87ecf047fc939f5cf62ddb7a2b677. Checksum match: true. This local checksum is validation evidence and the workflow independently creates and audits the official archive."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

name: Pinterest OAuth test.3.29 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.29

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.29'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.29
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.29-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.29-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.29-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.29-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.29-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.29") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Source checkpoint: 5bbac64e9fd58688d8e796b26554c821404f2d88. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev: 0 vulnerabilities; native Windows trusted-main-frame IPC validation; Windows DPAPI encrypted local vault; authenticated read-only Pinterest connection. Existing observation, thumbnails, deterministic Content readiness, account analytics, Top Pins analytics, contribution, rate context, adaptive charts, and momentum comparisons remain available. New safe Content readiness context on snapshot-matched Top Pins. Trusted composition joins Top Pins, the current session Pin snapshot, and the existing Content readiness audit only by internal Pin ID; the internal Pin ID is discarded before the renderer DTO; raw Pin IDs never enter renderer output, DOM, accessible text, attributes, logs, or diagnostics. Exact safe readiness extension: status is Ready or NeedsAttention; issueCount; requiredIssueCount; reviewIssueCount. All counts are bounded non-negative safe integers; required and review counts must reconcile exactly to issueCount; Ready requires zero issues; NeedsAttention requires at least one issue. Invalid or contradictory readiness degrades only that row to unavailable and never removes valid Top Pins metrics or ranking. UI displays Content ready, Content needs attention (N), or Content readiness unavailable. The summary reconciles ready, needs-attention, and unavailable counts to the maximum-25 rendered Top Pins; no new table column was added; existing global Content readiness totals and Attention count remain unchanged. Duplicate-only observations preserve matching context; changed Pin snapshots invalidate Top Pins and readiness context; authentication clearing removes readiness context through existing lifecycle behavior. Read Top Pins does not automatically invoke Read observation; Read observation does not automatically invoke Read Top Pins; rendering, sorting, selectors, summaries, and navigation add zero Pinterest requests. This is deterministic content validation only: no score, performance grading, recommendation, prediction, winner/loser label, or causal attribution. No audit issue codes or messages enter the Top Pins renderer DTO. Security: no board IDs, destination URLs, thumbnails, provider payloads, OAuth material, tokens, cookies, callback data, headers, or credentials cross the renderer boundary; safe createElement/textContent rendering only; unsigned Windows x64 test build; provider and authentication secrets are never included in release assets."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

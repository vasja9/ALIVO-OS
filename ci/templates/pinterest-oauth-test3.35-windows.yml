name: Pinterest OAuth test.3.35 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.35

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.35'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.35
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.35-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.35-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.35-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.35-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.35-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.35") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Complete source checkpoint: 73de2368d1e1db6fe57aa2ad6d455304d9c00aae. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev: 0 vulnerabilities; authenticated read-only Pinterest connection; Windows DPAPI encrypted local vault; deterministic unsigned Windows x64 test build. Adds session-local Pinterest Pin lifecycle evidence to Top Pins. Provider created_at is the only age source; missing or invalid dates remain Unknown and are never replaced with observation time. Completed UTC age cohorts are 0-59, 60-90, 91-180, 181-600, 601+, and Unknown. Outbound evidence is Reached alivo.eu, No outbound click yet, or Unavailable and covers only the current 30 completed UTC-day window. Zero observed outbound clicks is not classified as failure. Variant eligibility is not determined because complete since-publication click history is unavailable. No creative variant is generated, no scheduling priority is changed, and no persistence, extra Pinterest request, pins:write scope, publish, edit, delete, rerun, or renderer network transport is introduced. Renderer inputs remain bounded, copied, frozen, and free of raw Pin IDs, provider-private fields, credentials, audit codes, and arbitrary provider messages. Native Windows validation: PASS. Unit tests: 903/903. Pinterest DOM: 35/35. Windows integration: 1/1. Local configuration: 11/11. Package verification: PASS. Verified validation archive: ALIVO-OS-Pinterest-OAuth-test.3.35-validation-win-x64.zip. Validation archive bytes: 140561643. Validation archive SHA-256: 44cf1492944e83407ea87cd69e93147fd7df50be3fb2fab0b00f04e81549f6e5. Sidecar checksum: exact match. This checksum is validation evidence; the tagged workflow independently creates and audits the official archive."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

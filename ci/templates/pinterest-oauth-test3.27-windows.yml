name: Pinterest OAuth test.3.27 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.27

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.27'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.27
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.27-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.27-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.27-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.27-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.27-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.27") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Source checkpoint: fe0f643a903b01849134c23549376efbaffc082e. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev both passed with 0 vulnerabilities; native Windows trusted-main-frame Electron IPC validation; Windows DPAPI encrypted local vault; authenticated read-only Pinterest connection. Existing read-only capabilities remain available: Pin observation, secure thumbnails, deterministic Content readiness, organic account analytics, Top Pins analytics, observed-rate views, contribution analysis, and Observed 15-day count and rate comparisons. New local chart context: same-period account-rate references appear in the existing Top Pins chart only for Save rate, Pin click rate, and Outbound click rate; no new chart, API call, DTO, OAuth scope, IPC method, persistence, or background behavior is added; count metrics show neither a reference nor an unavailable message. Account formulas are saves / impressions × 100, Pin clicks / impressions × 100, and outbound clicks / impressions × 100; account and Top Pins snapshots must have exactly matching startDate, endDate, and 30 completed UTC days; valid zero numerator displays 0.00%; zero denominator or malformed or mismatched input fails closed; rates above 100% remain uncapped. The adaptive Y-axis includes the account reference before nice-scale calculation while preserving the existing zero baseline, 10% headroom, fixed height, bounded width, and horizontal scrolling; the reference is visible as both a dashed SVG line and text label; it is descriptive context only and is not a target, score, recommendation, causal attribution, prediction, or forecast; retained matching snapshots may display a visible stale notice; authentication clearing or changed windows removes the reference; selector changes, sorting, rendering, and navigation add zero Pinterest requests. Security: no raw Pin IDs, provider payloads, full URLs, board IDs, thumbnails, OAuth material, tokens, cookies, callback data, headers, or credentials cross the renderer boundary; safe createElement/createElementNS/textContent rendering only; generated package is an unsigned Windows x64 test build; provider payloads, OAuth tokens, callback data, and credentials are never included in release assets."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

name: Pinterest OAuth test.3.34 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.34

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.34'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.34
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.34-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.34-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.34-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.34-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.34-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.34") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Complete source checkpoint: 7346e4eba5b498e96b57e49448498bb78593026d. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev: 0 vulnerabilities; authenticated read-only Pinterest connection; Windows DPAPI encrypted local vault; deterministic unsigned Windows x64 test build. Adds explicit session-local Top Pins review outcomes: Pending review, Keep current content, Prepare revision, and Consider deletion. Each selected Pin has at most one mutually exclusive bounded UI-local outcome. No Pin is selected automatically and no outcome is assigned automatically. Contradictory local state fails closed to Pending. Summaries and outcome filters are deterministic. Return to pending, removal, reselection, clearing, retention, and reset follow the verified lifecycle. Consider deletion is descriptive and local only. Consider deletion does not delete, hide, edit, mutate, or remove a Pinterest Pin. OAuth scopes remain exactly boards:read, pins:read, and user_accounts:read. No pins:write scope, DELETE transport, delete IPC method, persistence, or renderer network transport is introduced. Adds direct Open Manual Top Pins review (N) navigation. The direct button appears only for a non-empty selection and disappears after clearing. One activation uses the existing Attention navigation path, reveals the Manual Top Pins review section, scrolls it into view, and focuses its heading. Selection, outcomes, the review filter, sorting, charts, summaries, contribution calculations, and copied DTOs remain unchanged during navigation. Native review controls and direct navigation support mouse, Enter, and Space. All review controls and navigation issue zero additional Pinterest requests. Renderer inputs remain bounded and copied. No raw Pin IDs, provider-private fields, credentials, audit codes, or arbitrary provider messages reach the UI. Native Windows Electron integration: PASS — 1/1. Packaged-app functional verification: PASS. Verified local archive: ALIVO-OS-Pinterest-OAuth-test.3.34-local-r2-win-x64.zip. Local archive bytes: 140559540. Local archive SHA-256: 45954fe14dde3064874848efce8f2dba90bcbd67c785766cf340e06a0494309e. Sidecar checksum: exact match. This local checksum is validation evidence and the workflow independently creates and audits the official archive."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

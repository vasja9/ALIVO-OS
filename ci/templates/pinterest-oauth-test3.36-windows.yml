name: Pinterest OAuth test.3.36 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.36

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.36'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.36
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.36-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle-evidence-memory.cjs
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.36-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.36-win-x64.zip.sha256"
          $records = @(Get-Content -LiteralPath $sidecar.FullName | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($records.Count -ne 1) { throw "Portable sidecar must contain exactly one SHA-256 record" }
          $record = [regex]::Match($records[0], '^([0-9a-fA-F]{64}) {2}' + [regex]::Escape($zip.Name) + '$')
          if (-not $record.Success) { throw "Portable sidecar has an invalid hash or ZIP filename" }
          $expected = $record.Groups[1].Value.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -cne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.36-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-(?:local-config|lifecycle-evidence|sessions)\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          $packageRoot = Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.36-win-x64"
          foreach ($requiredPath in @("ALIVO OS.exe", "README-FIRST.txt", "resources/app.asar")) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $requiredPath))) {
              throw "Portable ZIP is missing required path: $requiredPath"
            }
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.36") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Complete source checkpoint: e2f9d4e624ca27fe401e13a5eb9dd0db42ad2b6c. Foundation: Electron 43.4.1; authenticated read-only Pinterest connection; Windows DPAPI encrypted local vault; deterministic unsigned Windows x64 test build. Adds bounded cross-session Pinterest lifecycle evidence memory behind the Electron main-process boundary. It accepts only explicit complete per-Pin windows of exactly 30 completed UTC days; bounded Top Pins 25 results are rejected as insufficient evidence for zero clicks. Internal Pin references exist only inside the DPAPI-encrypted document and never enter renderer-safe summaries. Exact UTC dates, non-negative safe click counts, atomic writes, serialized updates, deterministic deduplication, and conflict or overlap rejection are enforced. Retention is bounded to 1,000 Pins and 20 windows or 600 days per Pin. EligibleForBrief requires complete continuous evidence since publication, at least 60 completed days, and zero observed outbound clicks. Any observed outbound click or age below 60 is NotEligible; missing, gapped, stale, or no-longer-retained history remains Unknown. Zero clicks never means a failed Pin. No creative variant is generated, no live evidence feed is connected, no scheduler priority changes, and no extra Pinterest request, pins:write scope, publish, edit, delete, renderer persistence, or renderer network transport is introduced. Application behavior remains unchanged until a future complete per-Pin evidence source is connected. Native Windows validation: PASS, run 33247298063, attempt 1. Unit tests: 910/910. Pinterest DOM: 35/35. Windows integration: 1/1. Local configuration: 11/11. Package verification: PASS. Verified validation archive: ALIVO-OS-Pinterest-OAuth-test.3.36-validation-win-x64.zip. Validation archive bytes: 140564415. Validation archive SHA-256: 0a9a5f68415575c67aad8736c9289175782bae5453897947cb0fda18ed91ed86. Sidecar checksum: exact match. This checksum is validation evidence; the tagged workflow independently creates and audits the official archive."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

name: Pinterest OAuth test.3.28 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.28

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.28'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.28
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.28-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.28-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.28-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.28-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.28-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.28") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Source checkpoint: 7a80c9f1a26d1339913d0b605ba831e3e1205ccb. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev both passed with 0 vulnerabilities; native Windows trusted-main-frame IPC validation; Windows DPAPI encrypted local vault; authenticated read-only Pinterest connection. Existing read-only Pin observation, secure thumbnails, deterministic Content readiness, organic account analytics, Top Pins analytics, adaptive charts, contribution analysis, momentum comparisons, and account-rate chart references remain available. New local table context: a sortable Outbound vs account column appears immediately after Outbound click rate and shows the same-period account outbound rate with the exact shared 30-day UTC context. The account formula is account outboundClicks / account impressions × 100; the Pin formula is Pin outboundClicks / Pin impressions × 100; the displayed difference is the unrounded Pin rate minus the unrounded account rate, expressed in percentage points. Positive values use +X.XX pp; negative values use a real minus sign as −X.XX pp; exact zero uses 0.00 pp; unavailable values use —; zero numerators remain valid; zero denominators and malformed or mismatched inputs fail closed; rates and differences remain uncapped. Account and Top Pins windows must match exactly and contain 30 completed UTC days. Default endpoint order remains unchanged; first column activation sorts descending and second activation sorts ascending; sorting is numeric, stable, copied-array, and unavailable-last; sorting does not mutate chart order, source DTOs, contribution calculations, or account state. Account-first and Top-Pins-first read order both work; matching stale snapshots retain visibly marked context; changed windows, invalidated Top Pins, or authentication clearing remove the context; rendering, sorting, selectors, and navigation add zero Pinterest requests. This is descriptive context only, with no score, recommendation, target, winner/loser label, causal attribution, prediction, or forecast. Security: no raw Pin IDs, board IDs, full URLs, thumbnails, provider payloads, OAuth material, tokens, cookies, callback data, headers, or credentials cross the renderer boundary; safe createElement/textContent rendering only; the generated package is an unsigned Windows x64 test build; private provider and authentication data are never included in release assets."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

name: Pinterest OAuth test.3.30 portable release

on:
  push:
    tags:
      - pinterest-oauth-test.3.30

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.30'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.30
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.30-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.30-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.30-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.30-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.30-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.30") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Complete source checkpoint: c797dea263ee27f14d2ff1dd18cc9dd3de036179; original review-filter implementation: a09d3170e9bbeada856856f0fd14e1bc96da3253; interactive readiness-badge follow-up: c797dea263ee27f14d2ff1dd18cc9dd3de036179. Foundation: Electron 43.4.1; npm audit and npm audit --omit=dev: 0 vulnerabilities; authenticated read-only Pinterest connection; Windows DPAPI encrypted local vault; unsigned Windows x64 test build. Adds deterministic session-local Top Pins review filters: All; Content needs attention; Below account outbound rate; Both signals. Counts are calculated only from safely copied, maximum-25 snapshot-matched Top Pins rows. Content needs attention requires validated NeedsAttention readiness. Below account outbound rate requires a valid unrounded outbound-rate difference strictly below zero. Both signals is the intersection of those two conditions. Zero, positive, and unavailable differences are excluded from the below-account filter; unavailable readiness is excluded from the attention filter. The table reports Showing X of Y snapshot-matched Top Pins. Empty results use the bounded local empty state. Filtering occurs before the existing stable table sort; filter and sort preserve one another without mutating source arrays. Charts, account metrics and context, contribution calculations, summaries, rankings, and DTOs remain independent and unchanged. Filter state is session-local and non-persistent. It survives navigation, sorting, duplicate observations, and retained stale results. It resets for a new valid Top Pins result, changed Pin snapshot, authentication clearing, or loss of the retained result. Validated per-row Content needs attention (N) badges are native buttons. Mouse, Enter, and Space activate the existing Content needs attention filter. Ready and unavailable readiness labels remain non-interactive. Badge activation reuses the existing filter pipeline. Filtering, sorting, badge activation, selectors, rendering, and navigation issue zero additional Pinterest requests; explicit Pinterest read actions remain the only request sources. No score, prediction, recommendation, ranking modification, or causal claim is introduced. No raw Pin IDs, provider payloads, audit codes or messages, OAuth material, credentials, URLs, or private data are rendered. No renderer network transport, persistence, unsafe HTML or SVG primitive, or inline event attribute is introduced. No API, parser, DTO, OAuth, Electron, IPC, lifecycle, authentication, dependency, or package contract changes are made. Content readiness remains deterministic advisory context, not performance analytics. Native Windows Electron trusted-main-frame test: 1/1 passed. Final local refinement package validation evidence: 140554403 bytes; SHA-256 cc4ba86391e01d831b005f8e151019d93781a37a8be7d74f4fe76453f59cb2ec; checksum match true. This local checksum is validation evidence only; the automatic workflow independently produces and audits the official release archive and checksum."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

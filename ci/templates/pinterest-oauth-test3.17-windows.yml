name: Pinterest OAuth test.3.17 portable release

on:
  workflow_dispatch:
  push:
    tags:
      - pinterest-oauth-test.3.17

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.17'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.17
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.17-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.17-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.17-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.17-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.17-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.17") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Foundation: Electron 43.4.1; npm audit: 0 vulnerabilities; native Windows Electron IPC validation; trusted canonical hash-route protection; Windows DPAPI local encrypted vault; authenticated Pinterest read-only connection; production /v5/pins normalization; bounded /v5/boards name resolution; secure bounded Pinterest thumbnails; maximum 25 session-local Pins; no Pinterest data or thumbnail persistence. Content Readiness Audit: deterministic read-only content audit; runs only after explicit Read observation; Refresh status and Verify read access do not retrieve Pins, Boards, thumbnails, or audit data; performs no network requests; uses only pinId, title, description, createdAt, boardName, destinationDomain, and thumbnail-present boolean; output contains no URLs, image data, board IDs, provider payloads, OAuth/session material, or credentials; maximum 25 immutable audit entries; fixed Required and Review issue codes; Unicode code-point title limit 100 and description limit 800; exact alivo.eu and true-subdomain governance boundary; missing title and destination checks; missing description, thumbnail, board name, and creation-date checks; deterministic duplicate-title and duplicate-content review; bounded whole-token test/placeholder-content detection; Attention count represents distinct affected Pins; duplicate-only Read retains Pins, thumbnails, and audit; temporary observation failure retains the last valid audit; no arbitrary numerical quality score; no AI/model call; no predicted reach, impressions, clicks, saves, CTR, conversions, ranking, or revenue. UI states: Deterministic content audit · Not performance analytics. Fixed local issue guidance uses createElement and textContent only; no editing, publishing, external href, provider HTML, or write action. Security and package: no write scopes or publishing endpoint; provider image URLs remain main-process-only; no Authorization, Cookie, Referer, OAuth token, callback data, provider payload, or credentials in renderer or release assets; exact https://i.pinimg.com thumbnail host; no redirects, credentials, ports, host lookalikes, or traversal; JPEG/PNG/WebP MIME, magic-byte, and complete-container validation; maximum concurrency 4; timeout 8 seconds; maximum 256 KiB per image and 6 MiB per snapshot; valid base64 preserved without generic text truncation; no downloaded image file in the package or release; deterministic Node/yazl ZIP; unsigned Windows x64 test build."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

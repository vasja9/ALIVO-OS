name: Pinterest OAuth test.3.16 portable release

on:
  workflow_dispatch:
  push:
    tags:
      - pinterest-oauth-test.3.16

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build unsigned Windows x64 portable release
    runs-on: windows-latest
    if: github.ref == 'refs/tags/pinterest-oauth-test.3.16'
    env:
      ALIVO_PORTABLE_PACKAGE_SUFFIX: test.3.16
      CI: "true"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify public package sources
        run: npm run verify:package-sources

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron

      - name: Run unit and Pinterest validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:pinterest:dom
          npm run test:pinterest:electron-windows
          npm run test:pinterest:local-config

      - name: Scan tracked source for private credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}' -- ':!ci/templates/pinterest-oauth-test3.16-windows.yml'; then
            echo "Potential private credential material found in tracked source."
            exit 1
          fi

      - name: Build and verify Electron sources
        run: |
          npm run build
          npm run desktop:smoke
          node --check electron/pinterest-lifecycle.cjs
          node --check electron/pinterest-ipc-controller.cjs
          node --check electron/pinterest-runtime.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check ui/pinterest.js
          node --check ui/pinterest-connection-state.js
          python scripts/audit_build0.py

      - name: Verify portable packaging rules
        run: npm run package:verify

      - name: Build deterministic unsigned portable package
        shell: bash
        run: npm run package:portable:windows

      - name: Audit generated archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.16-win-x64.zip"
          $sidecar = Get-Item "release/ALIVO-OS-Pinterest-OAuth-test.3.16-win-x64.zip.sha256"
          $expected = (Get-Content $sidecar.FullName -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable ZIP checksum does not match its sidecar" }

          $auditDirectory = Join-Path $env:RUNNER_TEMP "alivo-test.3.16-audit"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $auditDirectory -Force
          $forbidden = Get-ChildItem -LiteralPath $auditDirectory -Recurse -Force | Where-Object {
            $_.FullName -match '(^|[\\/])(?:tests?|coverage|src|scripts|\.local|\.git|node_modules)(?:[\\/]|$)' -or
            $_.Name -match '\.map$|^\.env(?:\.|$)|pinterest-local-config\.enc'
          }
          if ($forbidden) {
            throw "Portable ZIP contains forbidden paths: $($forbidden.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $auditDirectory "ALIVO-OS-Pinterest-OAuth-test.3.16-win-x64/ALIVO OS.exe"))) {
            throw "Portable ZIP does not contain ALIVO OS.exe"
          }

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "pinterest-oauth-test.3.16") {
            throw "Unexpected release tag: $tag"
          }
          $packageSuffix = $tag -replace '^pinterest-oauth-', ''
          $releaseBase = "ALIVO-OS-Pinterest-OAuth-$packageSuffix-win-x64"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Pinterest OAuth $packageSuffix" `
              --prerelease `
              --notes "Electron 43.4.1. npm audit: 0 vulnerabilities. Native Windows Electron IPC validation with trusted canonical hash-route protection and Windows DPAPI local encrypted vault validation. Authenticated Pinterest read-only connection with production /v5/pins normalization and bounded read-only /v5/boards name resolution. Explicit Read observation is the only action that retrieves Pins, Boards, or thumbnails; Refresh status and Verify read access perform no Pin, Board, or thumbnail retrieval. The session-local snapshot contains at most 25 Pins; duplicate-only reads retain Pins and thumbnails without refetching. Dates use deterministic DD.MM.YY presentation with safe board and destination-domain metadata. Safe Pinterest image selection accepts media_type image only, prefers 400x300, and falls back to 150x150. Thumbnail sources require the exact https://i.pinimg.com allowlist and reject redirects, credentials, ports, malformed paths, hostname lookalikes, and encoded traversal. Main-process Node HTTPS retrieval sends no Authorization, OAuth token, Cookie, Referer, callback data, or Electron session cookies. JPEG, PNG, and WebP require matching MIME, magic bytes, and complete container validation; SVG, GIF, HTML, JSON, and malformed images are rejected. Fetch timeout is 8 seconds, concurrency is at most 4, each thumbnail is at most 256 KiB, and the session snapshot is at most 6 MiB. Provider image URLs and raw media never cross the renderer boundary. The renderer receives only validated MIME and complete base64 data; valid base64 is preserved byte-for-byte and never processed by generic text truncation. Thumbnail failures degrade to No image without failing the observation. No Pinterest data or thumbnails are persisted. Rendering uses createElement and textContent only, with no external href, raw provider src, or innerHTML. No write scopes, publishing endpoint, arbitrary external image host, raw provider response, downloaded thumbnail file, credential, or local user path is added. Provider payloads, OAuth tokens, callback data, headers, cookies, and credentials are never included in release assets. Deterministic Node/yazl ZIP. Unsigned Windows x64 test build."
          }
          gh release upload $tag `
            "release/$releaseBase.zip" `
            "release/$releaseBase.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALIVO OS · Authentication</title><style>body{margin:0;background:rgb(156,28,49);color:#fffaf7;font:15px system-ui,sans-serif}main{padding:28px;max-width:620px;margin:auto}h1{margin:.2rem 0 1rem}p{color:#f1dfe2;line-height:1.5}.card{background:rgba(93,13,31,.65);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:22px}.grid{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:600}input{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(78,8,25,.48);color:#fff}button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.3);cursor:pointer}.primary{background:#fff4d2;color:#5c0a1d;font-weight:700}.secondary{background:transparent;color:#fff}.actions{display:flex;gap:10px;margin-top:18px}.status{margin-top:16px;padding:12px;border-radius:8px;background:rgba(0,0,0,.18);min-height:20px}.ok{outline:1px solid rgba(166,255,191,.55)}.error{outline:1px solid rgba(255,190,190,.65)}small{color:#f1dfe2}</style></head><body><main><p>Governed secure connection</p><h1 id="title">Integration Authentication</h1><div class="card"><div id="form" class="grid"></div><div class="actions"><button id="verify" class="primary">Verify & Save</button><button id="cancel" class="secondary">Cancel</button></div><div id="status" class="status" aria-live="polite">Enter credentials, then verify. No content will be published.</div></div><p><small>Credentials are sent only to the Electron main process, verified against the provider, and stored encrypted by the operating system after a successful check.</small></p></main><script src="auth.js"></script></body></html>

name: ALIVO marketing policy checks

on:
  pull_request:
    paths:
      - 'src/business/marketing/**'
      - 'src/business/market/blog/writing/**'
      - 'src/integrations/pinterest/PinterestCopyProduction*'
      - 'tests/unit/**'
      - '.github/workflows/alivo-marketing-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: TypeScript compile check
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Desktop static smoke check
        run: npm run desktop:smoke
